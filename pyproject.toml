[project]
name = "finance-manager"
version = "0.1.0"
description = "Finance Agent AI manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
]

[tool.pytest.ini_options]
markers = ["integration: tests that call the real LLM, slower"]

[tool.uv]
package = true
