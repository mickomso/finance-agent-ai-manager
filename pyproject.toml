[project]
name = "finance-manager"
version = "0.1.0"
description = "Finance Agent AI manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "responses>=0.26.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
markers = ["integration: tests that call the real LLM, slower"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"] 
